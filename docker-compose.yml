version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: changeflow_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=changeflow
    volumes:
      - changeflow_mongodb_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongosh --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 5

  changeflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: changeflow_enterprise
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=changeflow-prod-jwt-secret-key-32chars-minimum-required!
      - MONGODB_URI=mongodb://mongodb:27017/changeflow?replicaSet=rs0
      - SLA_CRON_SCHEDULE=0 * * * *
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-ChangeFlow Enterprise <alerts@changeflow.enterprise>}
    volumes:
      - changeflow_uploads:/app/uploads

volumes:
  changeflow_mongodb_data:
    driver: local
  changeflow_uploads:
    driver: local
