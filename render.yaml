services:
  - type: web
    name: changeflow-enterprise
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SLA_CRON_SCHEDULE
        value: "0 * * * *"
